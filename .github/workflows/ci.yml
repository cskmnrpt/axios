name: 'Run tests from Qase'

on:
  workflow_dispatch:
    inputs:
      qase_api_base_url:
        description: "Qase API URL"
        required: true
      qase_report:
        description: "Enabled/disabled reporting to Qase"
        required: true
      qase_project_code:
        description: "Qase project code"
        required: true
      qase_run_id:
        description: "Qase Run ID"
        required: true
      qase_run_complete:
        description: "Qase Run autocomplete"
        required: true

  # push:
  #   branches:
  #     - '*'
  #     - '*/*'
  #     - '**'
  #     - '!sponsors'
  # pull_request:
  #   branches:
  #     - '*'
  #     - '*/*'
  #     - '**'
  #     - '!sponsors'

env:
  QASE_API_BASE_URL: ${{ inputs.qase_api_base_url }}
  QASE_TESTOPS_PROJECT: ${{ inputs.qase_project_code }}
  QASE_TESTOPS_RUN_ID: ${{ inputs.qase_run_id }}
  QASE_TESTOPS_RUN_COMPLETE: true
  QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TOKEN }}
  QASE_MODE: 'testops'
  QASE_ROOT_SUITE: 'automation-demo'


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 24.x]
      fail-fast: false

    steps:
      - uses: cskmnrpt/qase-link-run@v2
        env:
          QASE_TESTOPS_API_TOKEN: ${{ env.QASE_TESTOPS_API_TOKEN }}

      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
      - name: List all changed files
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "$file was changed"
          done
      - name: Check changes
        id: changed-ignored
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **.md
            sandbox/**
            examples/**
            .github/**
            templates/**
            bin/**
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
        if: steps.changed-ignored.outputs.only_modified == 'false'

      - run: npm ci
        if: steps.changed-ignored.outputs.only_modified == 'false'

      - run: npm run build
        if: steps.changed-ignored.outputs.only_modified == 'false'

      - run: npm test
        if: steps.changed-ignored.outputs.only_modified == 'false'

    #   - name: Run Server tests
    #     run: npm run test:node
    #     if: steps.changed-ignored.outputs.only_modified == 'false'
